services:
  mongo:
    image: mongo:5.0
    volumes:
      - mongo-data:/data/db
  godata:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    depends_on:
      - mongo
    ports:
      - "8000:3000"
    volumes:
      - godata-state:/app/storage-state
volumes:
  mongo-data:
  godata-state:
